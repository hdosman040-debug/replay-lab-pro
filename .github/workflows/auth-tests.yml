name: Authentication and saved-state regression
on:
  pull_request:
    paths:
      - 'src/lib/auth/**'
      - 'src/lib/store/**'
      - 'src/components/layout/**'
      - 'src/components/chart/**'
      - 'src/routes/index.tsx'
      - 'src/lib/supabaseClient.ts'
      - 'src/routes/login.tsx'
      - 'src/routes/__root.tsx'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package*.json'
      - '.github/workflows/auth-tests.yml'
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:auth
      - run: npx vitest run src/lib/store src/components/workspace/tradeRecording.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/auth.spec.ts
      - run: npx playwright test --config e2e/save-conflicts.config.ts
      - run: npx playwright test --config e2e/chart-touch.config.ts
      - run: npm run build
